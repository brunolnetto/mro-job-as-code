bundle:
  name: mro-data-platform
  engine: direct
  deployment:
    lock:
      enabled: true

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse used by Genie.
    default: 0000000000000000
  run_as_service_principal:
    description: Production run-as service-principal application ID.
    default: 00000000-0000-0000-0000-000000000000
  catalog:
    description: Environment-specific Unity Catalog catalog.
    default: mro_dev
  deployment_environment:
    default: dev
  deployment_slot:
    description: Technical deployment variant. DEV uses ephemeral; PROD uses blue or green.
    default: ephemeral
  deployment_strategy:
    description: Deployment lifecycle for the target.
    default: ephemeral
  source_schema:
    default: mro_sim_dev_ephemeral
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  semantic_schema:
    default: semantic
  ops_schema:
    default: ops

targets:
  dev:
    git:
      branch: dev
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
    variables:
      deployment_environment: dev
      deployment_slot: ephemeral
      deployment_strategy: ephemeral
      catalog: mro_dev
      source_schema: mro_sim_dev_ephemeral
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      semantic_schema: semantic
      ops_schema: ops

  prod_blue:
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    presets:
      trigger_pause_status: PAUSED
    variables:
      deployment_environment: prod
      deployment_slot: blue
      deployment_strategy: blue-green
      catalog: mro_prod
      source_schema: mro_sim
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      semantic_schema: semantic
      ops_schema: ops

  prod_green:
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    presets:
      trigger_pause_status: PAUSED
    variables:
      deployment_environment: prod
      deployment_slot: green
      deployment_strategy: blue-green
      catalog: mro_prod
      source_schema: mro_sim
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      semantic_schema: semantic
      ops_schema: ops
