resources:
  jobs:
    mro_analytics_pipeline:
      name: mro-analytics-pipeline-${var.deployment_environment}-${var.deployment_slot}
      description: 'Independent analytical pipeline consuming observable MRO source
        changes through Bronze, Silver, Gold, semantic metric views, and the final
        analytical quality gate.

        '
      tags:
        deployment_environment: ${var.deployment_environment}
        deployment_slot: ${var.deployment_slot}
        deployment_strategy: ${var.deployment_strategy}
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: 0 0/30 * * * ?
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: source_schema
        default: ${var.source_schema}
      - name: bronze_schema
        default: ${var.bronze_schema}
      - name: silver_schema
        default: ${var.silver_schema}
      - name: gold_schema
        default: ${var.gold_schema}
      - name: semantic_schema
        default: ${var.semantic_schema}
      - name: source_stability_lag_minutes
        default: '5'
      - name: reconciliation_failure_threshold
        default: '3'
      - name: ops_schema
        default: ${var.ops_schema}
      - name: freshness_failure_minutes
        default: '180'
      tasks:
      - task_key: bronze_ingest
        notebook_task:
          notebook_path: ../src/data_engineering/02_bronze_ingest.py
      - task_key: silver_master
        depends_on:
        - task_key: bronze_ingest
        notebook_task:
          notebook_path: ../src/data_engineering/03_silver_master.py
      - task_key: silver_mro
        depends_on:
        - task_key: silver_master
        notebook_task:
          notebook_path: ../src/data_engineering/04_silver_mro.py
      - task_key: silver_stock
        depends_on:
        - task_key: silver_master
        notebook_task:
          notebook_path: ../src/data_engineering/04_silver_stock.py
      - task_key: silver_procurement
        depends_on:
        - task_key: silver_master
        notebook_task:
          notebook_path: ../src/data_engineering/04_silver_procurement.py
      - task_key: silver_finance
        depends_on:
        - task_key: silver_master
        notebook_task:
          notebook_path: ../src/data_engineering/04_silver_finance.py
      - task_key: gold_dimensions
        depends_on:
        - task_key: silver_master
        notebook_task:
          notebook_path: ../src/data_engineering/05_gold_dimensions.py
      - task_key: gold_mro
        depends_on:
        - task_key: gold_dimensions
        - task_key: silver_mro
        notebook_task:
          notebook_path: ../src/data_engineering/06_gold_mro.py
      - task_key: gold_stock
        depends_on:
        - task_key: gold_dimensions
        - task_key: silver_stock
        notebook_task:
          notebook_path: ../src/data_engineering/06_gold_stock.py
      - task_key: gold_procurement
        depends_on:
        - task_key: gold_dimensions
        - task_key: silver_procurement
        notebook_task:
          notebook_path: ../src/data_engineering/06_gold_procurement.py
      - task_key: gold_finance
        depends_on:
        - task_key: gold_dimensions
        - task_key: silver_finance
        notebook_task:
          notebook_path: ../src/data_engineering/06_gold_finance.py
      - task_key: semantic_model
        depends_on:
        - task_key: gold_mro
        - task_key: gold_stock
        - task_key: gold_procurement
        - task_key: gold_finance
        notebook_task:
          notebook_path: ../src/analytics/07_semantic_model.py
      - task_key: process_mining
        depends_on:
        - task_key: silver_mro
        - task_key: silver_procurement
        - task_key: silver_finance
        notebook_task:
          notebook_path: ../src/analytics/09_process_mining.py
      - task_key: expectations
        depends_on:
        - task_key: gold_mro
        - task_key: gold_stock
        - task_key: gold_procurement
        - task_key: gold_finance
        notebook_task:
          notebook_path: ../src/data_engineering/08_expectations.py
      - task_key: observability
        depends_on:
        - task_key: semantic_model
        - task_key: process_mining
        - task_key: expectations
        notebook_task:
          notebook_path: ../src/data_engineering/09_observability.py
      - task_key: quality_gate
        depends_on:
        - task_key: observability
        notebook_task:
          notebook_path: ../src/data_engineering/08_quality_gate.py
