name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Python, architecture, and bundle validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python/notebook sources
        run: python -m compileall -q src tests

      - name: Validate CD helper syntax
        run: bash -n scripts/cd/blue_green.sh

      - name: Run architectural and schema-evolution tests
        run: pytest -q tests/architecture

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate all bundle targets structurally
        shell: bash
        env:
          # workspace.host is an authentication field and cannot use Bundle
          # variable interpolation. A syntactically valid placeholder host is
          # supplied through unified-auth environment variables for CI only.
          DATABRICKS_HOST: https://example.invalid
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_TOKEN: ci-structural-validation-placeholder
        run: |
          set -euo pipefail
          common=(
            --var="warehouse_id=0000000000000000"
            --var="run_as_service_principal=00000000-0000-0000-0000-000000000000"
          )
          for target in dev_blue dev_green staging_blue staging_green prod_blue prod_green; do
            echo "Validating $target"
            databricks bundle validate -t "$target" "${common[@]}"
          done
