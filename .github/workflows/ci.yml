name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Python, YAML, and architecture validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python/notebook sources
        run: python -m compileall -q src tests

      - name: Validate YAML syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [Path("databricks.yml"), *Path("resources").glob("*.yml"), *Path(".github/workflows").glob("*.yml")]
          for path in files:
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"YAML OK: {path}")
          PY

      - name: Validate CD helper syntax
        run: bash -n scripts/cd/blue_green.sh

      - name: Run architectural and schema-evolution tests
        run: pytest -q tests/architecture
