name: Deploy DEV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mro-databricks-dev
  cancel-in-progress: false

jobs:
  static-validation:
    name: Revalidate release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile notebook sources
        run: python -m compileall -q src tests

      - name: Run architectural tests
        run: pytest -q tests/architecture

  deploy-and-smoke:
    name: Deploy and smoke test DEV
    needs: static-validation
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate DEV bundle
        run: databricks bundle validate -t dev

      - name: Deploy DEV bundle
        run: databricks bundle deploy -t dev --auto-approve --fail-on-active-runs

      - name: Bootstrap operational source
        run: >-
          databricks bundle run -t dev
          --params bootstrap_only=true
          mro_source_simulator

      - name: Advance operational simulation
        run: >-
          databricks bundle run -t dev
          --params ticks_per_run=1,step_minutes=60
          mro_source_simulator

      - name: Run analytical integration smoke test
        run: >-
          databricks bundle run -t dev
          --params source_stability_lag_minutes=0,reconciliation_failure_threshold=1
          mro_analytics_pipeline

      - name: Summarize DEV deployment
        if: always()
        run: databricks bundle summary -t dev
