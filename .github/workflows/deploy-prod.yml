name: Deploy PROD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mro-databricks-prod
  cancel-in-progress: false

jobs:
  static-validation:
    name: Validate production candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile notebook sources
        run: python -m compileall -q src tests

      - name: Run architectural tests
        run: pytest -q tests/architecture

  deploy:
    name: Deploy production bundle
    needs: static-validation
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD bundle
        run: databricks bundle validate -t prod

      - name: Deploy PROD bundle
        run: databricks bundle deploy -t prod --auto-approve --fail-on-active-runs

      - name: Summarize PROD deployment
        run: databricks bundle summary -t prod
