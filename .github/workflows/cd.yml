name: CD Blue-Green

on:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, staging, prod]
      operation:
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

permissions:
  contents: read
  id-token: write

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.ctx.outputs.environment }}
      operation: ${{ steps.ctx.outputs.operation }}
    steps:
      - id: ctx
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            case "$GITHUB_REF" in
              refs/heads/dev) environment=dev ;;
              refs/heads/staging) environment=staging ;;
              refs/heads/main) environment=prod ;;
              *) exit 2 ;;
            esac
            operation=deploy
          else
            environment='${{ inputs.environment }}'
            operation='${{ inputs.operation }}'
            expected_branch="$environment"
            [[ "$environment" == prod ]] && expected_branch=main
            [[ "$GITHUB_REF" == "refs/heads/$expected_branch" ]] || { echo "$environment must deploy from $expected_branch" >&2; exit 1; }
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  validate:
    needs: context
    if: needs.context.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-ci.txt}
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q src tests
      - run: bash -n scripts/cd/blue_green.sh
      - run: pytest -q tests/architecture

  deploy:
    needs: [context, validate]
    if: needs.context.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    concurrency:
      group: mro-cd-${{ needs.context.outputs.environment }}
      cancel-in-progress: false
    env:
      DELIVERY_ENV: ${{ needs.context.outputs.environment }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - id: slots
        shell: bash
        run: |
          eval "$(scripts/cd/blue_green.sh discover "$DELIVERY_ENV")"
          echo "active_slot=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "candidate_slot=$CANDIDATE_SLOT" >> "$GITHUB_OUTPUT"
          echo "target=${DELIVERY_ENV}_${CANDIDATE_SLOT}" >> "$GITHUB_OUTPUT"
      - name: Validate candidate bundle
        run: >-
          databricks bundle validate -t '${{ steps.slots.outputs.target }}'
          --var="workspace_host=$DATABRICKS_HOST"
          --var="warehouse_id=$DATABRICKS_WAREHOUSE_ID"
          --var="run_as_service_principal=$DATABRICKS_CLIENT_ID"
      - name: Deploy inactive slot paused
        run: >-
          databricks bundle deploy -t '${{ steps.slots.outputs.target }}'
          --var="workspace_host=$DATABRICKS_HOST"
          --var="warehouse_id=$DATABRICKS_WAREHOUSE_ID"
          --var="run_as_service_principal=$DATABRICKS_CLIENT_ID"
          --auto-approve --fail-on-active-runs
      - name: Assert candidate paused
        run: scripts/cd/blue_green.sh assert-status "$DELIVERY_ENV" '${{ steps.slots.outputs.candidate_slot }}' PAUSED
      - id: integration
        name: Create isolated integration catalog
        shell: bash
        run: |
          name="mro_ci_${DELIVERY_ENV}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          name="${name//-/_}"
          databricks catalogs create "$name" --comment "Ephemeral MRO integration test catalog"
          echo "catalog=$name" >> "$GITHUB_OUTPUT"
      - name: Run isolated operational integration seed
        run: |
          target='${{ steps.slots.outputs.target }}'
          c='${{ steps.integration.outputs.catalog }}'
          databricks bundle run -t "$target" --var="workspace_host=$DATABRICKS_HOST" --var="warehouse_id=$DATABRICKS_WAREHOUSE_ID" --var="run_as_service_principal=$DATABRICKS_CLIENT_ID" --params "catalog=$c,schema=mro_sim,bootstrap_only=true" mro_source_simulator
          databricks bundle run -t "$target" --var="workspace_host=$DATABRICKS_HOST" --var="warehouse_id=$DATABRICKS_WAREHOUSE_ID" --var="run_as_service_principal=$DATABRICKS_CLIENT_ID" --params "catalog=$c,schema=mro_sim,ticks_per_run=2,step_minutes=60" mro_source_simulator
      - name: Run isolated analytics integration test
        run: |
          target='${{ steps.slots.outputs.target }}'
          c='${{ steps.integration.outputs.catalog }}'
          databricks bundle run -t "$target" --var="workspace_host=$DATABRICKS_HOST" --var="warehouse_id=$DATABRICKS_WAREHOUSE_ID" --var="run_as_service_principal=$DATABRICKS_CLIENT_ID" --params "catalog=$c,source_schema=mro_sim,bronze_schema=bronze,silver_schema=silver,gold_schema=gold,semantic_schema=semantic,ops_schema=ops,source_stability_lag_minutes=0,reconciliation_failure_threshold=1" mro_analytics_pipeline
      - name: Drop isolated integration catalog
        if: always() && steps.integration.outputs.catalog != ''
        run: databricks catalogs delete '${{ steps.integration.outputs.catalog }}' --force
      - name: Promote candidate
        run: scripts/cd/blue_green.sh promote "$DELIVERY_ENV" '${{ steps.slots.outputs.active_slot }}' '${{ steps.slots.outputs.candidate_slot }}'

  rollback:
    needs: context
    if: needs.context.outputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}
    env:
      DELIVERY_ENV: ${{ needs.context.outputs.environment }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - id: slots
        shell: bash
        run: |
          eval "$(scripts/cd/blue_green.sh discover "$DELIVERY_ENV")"
          [[ "$ACTIVE_SLOT" != none ]] || { echo 'No active slot to roll back' >&2; exit 1; }
          echo "active=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "previous=$CANDIDATE_SLOT" >> "$GITHUB_OUTPUT"
      - run: scripts/cd/blue_green.sh promote "$DELIVERY_ENV" '${{ steps.slots.outputs.active }}' '${{ steps.slots.outputs.previous }}'
