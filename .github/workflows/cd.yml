name: CD Blue-Green

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy or roll back
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      operation:
        description: Blue/green action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read
  id-token: write

concurrency:
  group: mro-cd-${{ github.event_name == 'push' && (github.ref_name == 'main' && 'prod' || 'dev') || inputs.environment }}
  cancel-in-progress: false

jobs:
  context:
    name: Resolve delivery context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      operation: ${{ steps.context.outputs.operation }}

    steps:
      - id: context
        name: Resolve environment and operation
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            operation="deploy"
            case "${GITHUB_REF}" in
              refs/heads/dev)
                environment="dev"
                ;;
              refs/heads/main)
                environment="prod"
                ;;
              *)
                echo "Unexpected deployment branch: ${GITHUB_REF}" >&2
                exit 1
                ;;
            esac
          else
            environment="${{ inputs.environment }}"
            operation="${{ inputs.operation }}"

            case "$environment" in
              dev)
                expected_ref="refs/heads/dev"
                ;;
              prod)
                expected_ref="refs/heads/main"
                ;;
              *)
                echo "Unknown environment: $environment" >&2
                exit 1
                ;;
            esac

            if [[ "${GITHUB_REF}" != "$expected_ref" ]]; then
              echo "$environment delivery must be dispatched from $expected_ref; got ${GITHUB_REF}." >&2
              exit 1
            fi
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  static-validation:
    name: Revalidate delivery candidate
    needs: context
    if: needs.context.outputs.operation == 'deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile notebook sources
        run: python -m compileall -q src tests

      - name: Validate CD helper syntax
        run: bash -n scripts/cd/blue_green.sh

      - name: Run architectural tests
        run: pytest -q tests/architecture

  deploy:
    name: Deploy inactive slot, smoke, and promote
    needs: [context, static-validation]
    if: needs.context.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}

    env:
      DELIVERY_ENV: ${{ needs.context.outputs.environment }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      CATALOG: mro-data

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - id: slots
        name: Discover active and candidate slots
        shell: bash
        run: |
          set -euo pipefail
          eval "$(scripts/cd/blue_green.sh discover "$DELIVERY_ENV")"
          echo "active_slot=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "candidate_slot=$CANDIDATE_SLOT" >> "$GITHUB_OUTPUT"
          echo "candidate_target=${DELIVERY_ENV}_${CANDIDATE_SLOT}" >> "$GITHUB_OUTPUT"

      - name: Quiesce all DEV schedules
        if: needs.context.outputs.environment == 'dev'
        run: scripts/cd/blue_green.sh quiesce-dev

      - name: Validate inactive bundle target
        run: databricks bundle validate -t "${{ steps.slots.outputs.candidate_target }}"

      - name: Deploy inactive slot paused
        run: >-
          databricks bundle deploy
          -t "${{ steps.slots.outputs.candidate_target }}"
          --auto-approve
          --fail-on-active-runs

      - name: Assert candidate schedules are paused
        run: >-
          scripts/cd/blue_green.sh assert-status
          "$DELIVERY_ENV"
          "${{ steps.slots.outputs.candidate_slot }}"
          PAUSED

      - id: smoke
        name: Prepare isolated smoke schemas
        shell: bash
        run: |
          set -euo pipefail
          slot="${{ steps.slots.outputs.candidate_slot }}"
          suffix="${DELIVERY_ENV}_${slot}_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          echo "bronze_schema=bronze_${suffix}" >> "$GITHUB_OUTPUT"
          echo "silver_schema=silver_${suffix}" >> "$GITHUB_OUTPUT"
          echo "gold_schema=gold_${suffix}" >> "$GITHUB_OUTPUT"
          echo "semantic_schema=semantic_${suffix}" >> "$GITHUB_OUTPUT"

          if [[ "$DELIVERY_ENV" == "dev" ]]; then
            echo "source_schema=mro_sim_${suffix}" >> "$GITHUB_OUTPUT"
            echo "stability_lag=0" >> "$GITHUB_OUTPUT"
          else
            echo "source_schema=mro_sim" >> "$GITHUB_OUTPUT"
            echo "stability_lag=5" >> "$GITHUB_OUTPUT"
          fi

      - name: Exercise candidate operational code in ephemeral DEV source
        if: needs.context.outputs.environment == 'dev'
        run: |
          set -euo pipefail
          target="${{ steps.slots.outputs.candidate_target }}"

          databricks bundle run -t "$target" \
            --params "schema=${{ steps.smoke.outputs.source_schema }},bootstrap_only=true" \
            mro_source_simulator

          databricks bundle run -t "$target" \
            --params "schema=${{ steps.smoke.outputs.source_schema }},ticks_per_run=1,step_minutes=60" \
            mro_source_simulator

      - id: prod_source
        name: Ensure persistent PROD operational source exists
        if: needs.context.outputs.environment == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.slots.outputs.candidate_target }}"

          if databricks schemas get "$CATALOG.mro_sim" >/dev/null 2>&1; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Persistent production source does not exist; bootstrapping it once."
          databricks bundle run -t "$target" \
            --params "schema=mro_sim,bootstrap_only=true" \
            mro_source_simulator

          databricks bundle run -t "$target" \
            --params "schema=mro_sim,ticks_per_run=1,step_minutes=60" \
            mro_source_simulator

          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"

      - id: smoke_policy
        name: Resolve smoke stability policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DELIVERY_ENV" == "dev" ]]; then
            lag=0
          elif [[ "${{ steps.prod_source.outputs.bootstrapped }}" == "true" ]]; then
            lag=0
          else
            lag=5
          fi
          echo "stability_lag=$lag" >> "$GITHUB_OUTPUT"

      - name: Run isolated analytical smoke test
        run: |
          set -euo pipefail
          target="${{ steps.slots.outputs.candidate_target }}"

          databricks bundle run -t "$target" \
            --params "source_schema=${{ steps.smoke.outputs.source_schema }},bronze_schema=${{ steps.smoke.outputs.bronze_schema }},silver_schema=${{ steps.smoke.outputs.silver_schema }},gold_schema=${{ steps.smoke.outputs.gold_schema }},semantic_schema=${{ steps.smoke.outputs.semantic_schema }},source_stability_lag_minutes=${{ steps.smoke_policy.outputs.stability_lag }},reconciliation_failure_threshold=1" \
            mro_analytics_pipeline

      - name: Clean isolated smoke schemas
        if: always() && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          set +e
          for schema in \
            "${{ steps.smoke.outputs.semantic_schema }}" \
            "${{ steps.smoke.outputs.gold_schema }}" \
            "${{ steps.smoke.outputs.silver_schema }}" \
            "${{ steps.smoke.outputs.bronze_schema }}"
          do
            databricks schemas delete "$CATALOG.$schema" --force
          done

          if [[ "$DELIVERY_ENV" == "dev" ]]; then
            databricks schemas delete "$CATALOG.${{ steps.smoke.outputs.source_schema }}" --force
          fi
          exit 0

      - name: Promote candidate slot
        shell: bash
        run: >-
          scripts/cd/blue_green.sh promote
          "$DELIVERY_ENV"
          "${{ steps.slots.outputs.active_slot }}"
          "${{ steps.slots.outputs.candidate_slot }}"

      - name: Summarize promoted slot
        if: success()
        run: >-
          databricks bundle summary
          -t "${{ steps.slots.outputs.candidate_target }}"
          --force-pull

  rollback:
    name: Roll back to previous slot
    needs: context
    if: needs.context.outputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}

    env:
      DELIVERY_ENV: ${{ needs.context.outputs.environment }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - id: slots
        name: Discover current and previous slots
        shell: bash
        run: |
          set -euo pipefail
          eval "$(scripts/cd/blue_green.sh discover "$DELIVERY_ENV")"

          if [[ "$ACTIVE_SLOT" == "none" ]]; then
            echo "No active slot exists; rollback is not possible." >&2
            exit 1
          fi

          echo "active_slot=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "previous_slot=$CANDIDATE_SLOT" >> "$GITHUB_OUTPUT"
          echo "previous_target=${DELIVERY_ENV}_${CANDIDATE_SLOT}" >> "$GITHUB_OUTPUT"

      - name: Roll back blue-green state
        run: >-
          scripts/cd/blue_green.sh promote
          "$DELIVERY_ENV"
          "${{ steps.slots.outputs.active_slot }}"
          "${{ steps.slots.outputs.previous_slot }}"

      - name: Summarize restored slot
        run: >-
          databricks bundle summary
          -t "${{ steps.slots.outputs.previous_target }}"
          --force-pull
